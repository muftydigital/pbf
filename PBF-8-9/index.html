<!-- Menentukan bahwa dokumen ini menggunakan standar HTML5. -->
<!DOCTYPE html>
<!-- Elemen html menjadi pembungkus seluruh dokumen dan bahasa halaman ditetapkan ke English seperti sumber awal. -->
<html lang="en">
<!-- Head berisi informasi halaman yang tidak langsung tampil sebagai isi utama. -->
<head>
  <!-- Charset UTF-8 membuat karakter teks dapat ditampilkan dengan benar. -->
  <meta charset="UTF-8" />
  <!-- Favicon digunakan sebagai ikon kecil pada tab browser. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <!-- Viewport membuat tampilan halaman menyesuaikan ukuran layar perangkat. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Title adalah judul yang tampil pada tab browser. -->
  <title>Praktikum PBF Pertemuan 8 & 9</title>
<!-- Penutup bagian head. -->
</head>
<!-- Body menjadi tempat seluruh isi halaman yang dirender di browser. -->
<body>
  <!-- React akan memasukkan seluruh tampilan aplikasi ke div dengan id root ini. -->
  <div id="root"></div>
  <!-- File index.jsx menjadi titik awal program React dan dijalankan sebagai module. -->
  <script type="module" src="/src/index.jsx"></script>
<!-- Penutup body. -->
</body>
<!-- Penutup dokumen HTML. -->
</html>
