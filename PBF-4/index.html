<!-- Dokumen ini memakai HTML5. -->
<!DOCTYPE html>
<!-- html adalah tag utama dan bahasa halaman diatur ke Inggris. -->
<html lang="en">
  <!-- head berisi pengaturan halaman. -->
  <head>
    <!-- UTF-8 supaya berbagai karakter bisa ditampilkan dengan benar. -->
    <meta charset="UTF-8" />
    <!-- Ikon yang tampil pada tab browser. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Supaya ukuran halaman mengikuti ukuran layar perangkat. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Judul yang tampil pada tab browser. -->
    <title>React + TypeScript + Replit</title>
  </head>
  <!-- body berisi bagian halaman yang tampil di browser. -->
  <body>
    <!-- React akan menampilkan aplikasinya di dalam div ini. -->
    <div id="root"></div>
    <!-- Jalankan index.jsx sebagai file awal aplikasi. -->
    <script type="module" src="/src/index.jsx"></script>

    <!--
    Script bawaan Replit untuk menampilkan badge pada tampilan browser penuh.
    Warna badge diatur menjadi biru melalui atribut theme.
    -->
    <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script>
  </body>
</html>
