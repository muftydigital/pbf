<!DOCTYPE html>

<html>
<!-- Tag html menjadi pembungkus utama seluruh isi halaman -->

<head>
  <!-- Mengatur karakter supaya teks dapat ditampilkan dengan benar -->
  <meta charset="utf-8">

  <!-- Membuat tampilan menyesuaikan ukuran layar perangkat -->
  <meta name="viewport" content="width=device-width">

  <!-- Judul yang tampil pada tab browser -->
  <title>Variable</title>

  <!-- Menghubungkan halaman HTML dengan file CSS -->

</head>

<body>
  <!-- Menyediakan tempat untuk menampilkan hasil dari JavaScript jika dibutuhkan -->
  <p id="demo"></p>

  <!-- Menghubungkan halaman ini dengan file JavaScript materi Variable -->

</html>
