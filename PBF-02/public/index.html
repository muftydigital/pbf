<!DOCTYPE html>
<!-- Menandakan bahwa dokumen ini menggunakan HTML5 -->
<html lang="en">
  <!-- Bagian head berisi informasi dasar halaman -->
  <head>
    <!-- Mengatur karakter yang digunakan pada halaman -->
    <meta charset="utf-8" />

    <!-- Mengatur tampilan supaya menyesuaikan ukuran layar perangkat -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Menentukan warna tema pada browser yang mendukung -->
    <meta name="theme-color" content="#000000" />

    <!-- Memberikan deskripsi singkat mengenai halaman -->
    <meta
      name="description"
      content="Praktikum PBF Pertemuan 2 menggunakan React JS"
    />

    <!-- Judul yang akan tampil pada tab browser -->
    <title>PBF Pertemuan 2</title>
  </head>

  <!-- Bagian body merupakan tempat utama tampilan website -->
  <body>
    <!-- Pesan ini muncul jika JavaScript pada browser tidak aktif -->
    <noscript>JavaScript harus diaktifkan untuk menjalankan aplikasi ini.</noscript>

    <!-- Elemen root menjadi tempat React menampilkan seluruh komponen aplikasi -->
    <div id="root"></div>
  </body>
</html>
